name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - name: Install Flutter deps
        run: |
          flutter clean
          flutter pub get

      - name: Clean CocoaPods & DerivedData
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          cd ios
          pod repo update
          pod deintegrate
          rm -rf Podfile.lock Pods .symlinks build
          pod install --repo-update
          cd ..

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -qr Etqan.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/Etqan.ipa
