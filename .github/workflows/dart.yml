name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true
        id: flutter-action

      - name: Get Flutter path
        run: echo "FLUTTER_ROOT=$(which flutter | xargs dirname | xargs dirname)" >> $GITHUB_ENV

      - name: Fix Podfile paths
        run: |
          cd ios
          # Fix Flutter path
          sed -i '' "s|require .*|require '${{ env.FLUTTER_ROOT }}/packages/flutter_tools/bin/podhelper'|" Podfile
          
          # Remove existing FirebaseSharedSwift line
          sed -i '' '/FirebaseSharedSwift/d' Podfile
          
          # Add correct FirebaseSharedSwift version
          echo "pod 'FirebaseSharedSwift', '11.10.0'" >> Podfile
          
          # Set global Firebase version (CORRECTED APPROACH)
          sed -i '' "1i\\
          \$FirebaseSDKVersion = '11.10.0'
          " Podfile
          
          # Show modified Podfile
          echo "Modified Podfile:"
          cat Podfile

      - name: Update FlutterFire dependencies
        run: |
          # Use minimum version constraints
          sed -i '' 's/firebase_core: .*/firebase_core: ">=2.0.0"/' pubspec.yaml
          sed -i '' 's/firebase_auth: .*/firebase_auth: ">=4.0.0"/' pubspec.yaml
          sed -i '' 's/cloud_firestore: .*/cloud_firestore: ">=4.0.0"/' pubspec.yaml
          sed -i '' 's/firebase_storage: .*/firebase_storage: ">=11.0.0"/' pubspec.yaml
          sed -i '' 's/firebase_messaging: .*/firebase_messaging: ">=14.0.0"/' pubspec.yaml
          sed -i '' 's/firebase_app_check: .*/firebase_app_check: ">=0.0.1"/' pubspec.yaml
          sed -i '' 's/cloud_functions: .*/cloud_functions: ">=4.0.0"/' pubspec.yaml

      - name: Resolve dependencies
        run: flutter pub upgrade

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod repo update
          pod install --verbose
        timeout-minutes: 15

      - run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -qr Etqan.ipa Payload
        timeout-minutes: 10

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/Etqan.ipa
          tag: ${{ github.ref_name }}
          overwrite: true
          
