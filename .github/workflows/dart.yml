name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true  # Enable caching for faster builds
      
      - run: flutter pub get

      # CocoaPods handling with retry logic
      - name: Setup CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install --repo-update
        timeout-minutes: 15

      - run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -qr Etqan.ipa Payload
        timeout-minutes: 10

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/Etqan.ipa
          tag: ${{ github.ref_name }}  # Use current branch/tag
          overwrite: true
