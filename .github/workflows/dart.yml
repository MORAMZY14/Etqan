name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.19.5'  # Specify exact version for consistency
          architecture: x64

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.2'  # Match your local Ruby version if possible
          bundler-cache: true

      - name: Clean build artifacts
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks ios/Flutter/Flutter.podspec
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          pod cache clean --all

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update --verbose
        env:
          FLUTTER_BUILD_MODE: release

      - name: Build iOS app (Release)
        run: flutter build ios --release --no-codesign --verbose
        env:
          DEVELOPER_DIR: /Applications/Xcode_15.2.app  # Specify Xcode version if needed

      - name: Create IPA package
        run: |
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qr Etqan.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: Etqan-iOS-IPA
          path: build/ios/iphoneos/Etqan.ipa

      # Alternative: Upload to GitHub Releases (uncomment if needed)
