name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Update Flutter and dependencies
        run: |
          flutter upgrade
          flutter pub upgrade

      - name: Clean and setup
        run: |
          flutter clean
          flutter pub get

      - name: Fix iOS project settings
        run: |
          cd ios
          pod deintegrate
          rm -rf Podfile.lock Pods .symlinks build
          # Reset the iOS project to ensure clean state
          git checkout -- Runner.xcworkspace
          pod install --repo-update --clean-install
          cd ..

      - name: Build with specific flags
        run: |
          flutter build ios --release --no-codesign --verbose

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -qr Etqan.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/Etqan.ipa
