name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - run: flutter pub get

      # Fix Podfile paths before installing pods
      - name: Fix Flutter Path in Podfile
        run: |
          cd ios
          # Update Windows paths to macOS compatible paths
          sed -i '' 's|C:\\\\flutter|${HOME}/flutter|g' Podfile
          sed -i '' 's|require File.expand_path(.*|require "${HOME}/flutter/packages/flutter_tools/bin/podhelper"|g' Podfile
          cat Podfile  # Verify changes

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
        timeout-minutes: 15

      - run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -qr Etqan.ipa Payload
        timeout-minutes: 10

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/Etqan.ipa
          tag: ${{ github.ref_name }}
          overwrite: true
