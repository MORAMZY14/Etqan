name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          flutter-version: '3.19.0'  # Specify a specific version

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'  # Important for CocoaPods compatibility
          bundler-cache: true

      - name: Clean build artifacts
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          pod cache clean --all

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          sudo gem install cocoapods -v 1.14.0
          cd ios && pod install --repo-update && cd ..
        shell: bash

      - name: Build iOS app (Release)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=FLUTTER_BUILD_MODE=release \
            --dart-define=FLUTTER_BUILD_NAME=2.0 \
            --dart-define=FLUTTER_BUILD_NUMBER=20

      - name: Create Payload folder
        run: mkdir Payload
        working-directory: build/ios/iphoneos

      - name: Move Runner.app to Payload
        run: mv Runner.app Payload
        working-directory: build/ios/iphoneos

      - name: Zip the .ipa file
        run: zip -qq -r -9 Etqan.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/Etqan.ipa
          tag: v2.0
          overwrite: true
          body: "iOS release v2.0"
