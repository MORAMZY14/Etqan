name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true
        id: flutter-action  # Add ID to reference outputs later

      - run: flutter pub get

      # Get the actual Flutter installation path
      - name: Get Flutter path
        run: echo "FLUTTER_ROOT=$(which flutter | xargs dirname | xargs dirname)" >> $GITHUB_ENV

      # Fix Podfile using the actual Flutter path
      - name: Fix Podfile paths
        run: |
          cd ios
          # Use the environment variable with actual Flutter path
          sed -i '' "s|require .*|require '${{ env.FLUTTER_ROOT }}/packages/flutter_tools/bin/podhelper'|" Podfile
          # Verify the changes
          echo "Updated Podfile:"
          grep "require" Podfile
          echo "Actual Flutter path: ${{ env.FLUTTER_ROOT }}"

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
        timeout-minutes: 15

      - run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -qr Etqan.ipa Payload
        timeout-minutes: 10

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/Etqan.ipa
          tag: ${{ github.ref_name }}
          overwrite: true
