name: Build & Release

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Fixed directory paths and added iOS build fixes
      - name: Set execute permissions for gradlew
        run: chmod +x android/gradlew

      - name: Clean up build directories
        run: |
          rm -rf build
          rm -rf android/build

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Cache Flutter and Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      # Fixed: Added working directory
      - name: Clean Android project
        working-directory: android
        run: ./gradlew clean

      # Fixed: Added working directory and output path
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "APK not found!"
            exit 1
          fi

      - name: Check iOS Directory Exists
        run: |
          if [ ! -d "ios" ]; then
            echo "iOS directory not found!"
            exit 1
          fi

      # Fixed: Added working directory
      - name: Update CocoaPods
        working-directory: ios
        run: |
          pod repo update
          pod install

      # Fixed: Corrected IPA creation path and added directory check
      - name: Build iOS App
        run: |
          flutter build ios --release --no-codesign
          
          # Create output directory if needed
          mkdir -p build/ios/artifacts
          
          # Create IPA correctly
          cd build/ios/iphoneos
          zip -r ../../artifacts/Etqan.ipa Runner.app

      # Fixed: Correct artifact paths
      - name: Verify Artifacts Exist
        run: |
          if [ ! -f android/build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "Android APK not found!"
            exit 1
          fi
          if [ ! -f build/ios/artifacts/Etqan.ipa ]; then
            echo "iOS IPA not found!"
            exit 1
          fi

      # Fixed: Correct artifact paths and tag format
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            android/build/app/outputs/flutter-apk/app-release.apk
            build/ios/artifacts/Etqan.ipa
          tag: "v1.0.${{ github.run_number }}"
          token: ${{ secrets.GITHUB_TOKEN }}
