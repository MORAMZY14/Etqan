name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Install Android SDK API 34 instead of 35
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-34" "build-tools;34.0.0"

      # ✅ Force compileSdkVersion 34 in app/build.gradle
      - name: Patch compileSdkVersion
        run: |
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/' android/app/build.gradle || true

      # Patch Gradle/Kotlin Versions
      - name: Patch Gradle/Kotlin Versions
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip#g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#classpath "com.android.tools.build:gradle:.*"#classpath "com.android.tools.build:gradle:8.3.2"#g' android/build.gradle
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.25"/g' android/build.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.25"/g' android/settings.gradle || true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter clean
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
